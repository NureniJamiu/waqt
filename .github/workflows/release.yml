name: "Release Pipeline & Code Signing"

# Push a tag like v1.0.0 to build the macOS app and create a *draft* GitHub
# Release with it. Review the draft, then publish it; the website's download
# button and the in-app updater both follow the latest published release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    env:
      # Secrets can't be tested in `if:`, so expose whether they exist.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # With an Apple Developer ID the app is signed (and notarized when the
      # notary secrets exist too). Without one it is signed ad hoc ("-"): free,
      # and enough that Apple silicon doesn't report the app as damaged, but
      # users still approve it once in System Settings → Privacy & Security.
      - name: Choose signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$HAS_APPLE_CERT" = "true" ]; then
            echo "Signing with the Apple Developer ID certificate."
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
          else
            echo "No Apple certificate: signing ad hoc."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
          if [ "$HAS_APPLE_CERT" = "true" ] && [ "$HAS_NOTARY" = "true" ]; then
            echo "Notarizing with Apple."
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          fi

      - name: Build & Publish Tauri Release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Waqt v__VERSION__"
          releaseBody: |
            Waqt for macOS (Apple silicon and Intel, macOS 10.15 or later).

            **Download:** `Waqt_macOS.dmg` below.

            This build isn't signed with an Apple Developer ID yet. The first time you open it, macOS will say it can't verify the developer: open System Settings → Privacy & Security and click **Open Anyway**. Waqt then asks for Accessibility permission so it can move fullscreen apps out of the way before the pause.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The website links to /releases/latest/download/Waqt_macOS.dmg, so every
      # release carries a copy of the installer under that fixed name.
      - name: Attach Waqt_macOS.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          echo "Attaching $DMG"
          cp "$DMG" Waqt_macOS.dmg
          curl -sSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @Waqt_macOS.dmg \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets?name=Waqt_macOS.dmg" > /dev/null
